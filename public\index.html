<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通知公告板</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- 顶部导航 -->
    <header class="header" id="header">
      <div class="header-inner">
        <div class="logo" onclick="switchView('board')">
          <span class="logo-dot"></span>
          <span class="logo-text">NOTICE</span>
        </div>
        <nav class="nav">
          <span class="nav-time" id="navTime"></span>
          <button class="nav-btn" id="navAdminBtn" onclick="switchView('login')">管理员</button>
          <button class="nav-btn nav-btn--hidden" id="navLogoutBtn" onclick="logout()">退出</button>
        </nav>
      </div>
    </header>

    <!-- 视图容器 -->
    <main class="main">
      <!-- 公告板视图 -->
      <section class="view view--board active" id="view-board">
        <div class="board-header">
          <h1 class="board-title">通知公告</h1>
          <div class="board-stats">
            <span class="stat-item"><span class="stat-num" id="statTotal">0</span> 条通知</span>
            <span class="stat-divider"></span>
            <span class="stat-item live-indicator"><span class="live-dot"></span> 实时更新</span>
            <span class="stat-divider"></span>
            <button class="stat-item refresh-btn" onclick="refreshNotices()" id="refreshBtn">刷新</button>
            <span class="stat-divider"></span>
            <button class="stat-item qr-btn" onclick="showQRCode()">扫码访问</button>
          </div>
        </div>
        <div class="notice-list" id="noticeList">
          <div class="empty-state">
            <div class="empty-icon">—</div>
            <p>暂无通知</p>
          </div>
        </div>
      </section>

      <!-- 登录视图 -->
      <section class="view view--login" id="view-login">
        <div class="login-card">
          <div class="login-header">
            <div class="login-icon">
              <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                <rect x="8" y="16" width="24" height="18" rx="2" stroke="white" stroke-width="1.5"/>
                <path d="M14 16V12a6 6 0 0 1 12 0v4" stroke="white" stroke-width="1.5"/>
                <circle cx="20" cy="25" r="2" fill="white"/>
                <line x1="20" y1="27" x2="20" y2="30" stroke="white" stroke-width="1.5"/>
              </svg>
            </div>
            <h2>管理员登录</h2>
            <p class="login-sub">输入密码以管理通知</p>
          </div>
          <form class="login-form" onsubmit="return login(event)">
            <input type="password" class="login-input" id="loginPassword" placeholder="管理员密码" autocomplete="current-password" autofocus>
            <button type="submit" class="login-btn">登 录</button>
          </form>
          <button class="back-btn" onclick="switchView('board')">← 返回公告板</button>
        </div>
      </section>

      <!-- 管理视图 -->
      <section class="view view--admin" id="view-admin">
        <div class="admin-layout">
          <!-- 发布区 -->
          <div class="admin-panel">
            <h2 class="admin-section-title">发布通知</h2>
            <form class="publish-form" onsubmit="return publishNotice(event)">
              <input type="text" class="form-input" id="noticeTitle" placeholder="通知标题" maxlength="100" required>
              <textarea class="form-textarea" id="noticeContent" placeholder="通知内容..." rows="5" maxlength="2000" required></textarea>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">优先级</label>
                  <div class="level-picker">
                    <label class="level-option">
                      <input type="radio" name="level" value="normal" checked>
                      <span>普通</span>
                    </label>
                    <label class="level-option">
                      <input type="radio" name="level" value="important">
                      <span>重要</span>
                    </label>
                    <label class="level-option">
                      <input type="radio" name="level" value="urgent">
                      <span>紧急</span>
                    </label>
                  </div>
                </div>
              </div>
              <button type="submit" class="publish-btn">发布通知</button>
            </form>
          </div>

          <!-- 管理列表 -->
          <div class="admin-panel">
            <div class="admin-section-header">
              <h2 class="admin-section-title">已发布通知</h2>
              <span class="admin-count" id="adminCount">0</span>
              <button class="refresh-btn admin-refresh-btn" onclick="refreshAdminList()" id="refreshAdminBtn">刷新</button>
            </div>
            <div class="admin-list" id="adminList">
              <div class="empty-state small">
                <p>暂无通知</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Toast 提示 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 二维码弹窗 -->
  <div class="qr-modal" id="qrModal" onclick="if(event.target===this)closeQRCode()">
    <div class="qr-modal-content">
      <div class="qr-modal-header">
        <h3>扫码访问</h3>
        <button class="qr-close" onclick="closeQRCode()">&times;</button>
      </div>
      <div class="qr-modal-body">
        <img id="qrImage" alt="二维码" class="qr-image">
        <p class="qr-url" id="qrUrl"></p>
        <p class="qr-hint">手机扫码即可打开</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
